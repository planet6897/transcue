name: 버그 신고
description: 동작하지 않는 것
labels: ["type:bug"]
body:
  - type: textarea
    id: repro
    attributes: { label: 재현 방법 }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: 기대 동작 / 실제 동작 }
    validations: { required: true }
  - type: dropdown
    id: os
    attributes: { label: OS, options: [macOS, Windows, iOS, Android] }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: 앱 버전 / 영상 형식 }
