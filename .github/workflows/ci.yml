name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: core } }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.93.1
        with: { components: "rustfmt, clippy" }
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  app:
    strategy:
      matrix: { os: [macos-latest, windows-latest] }
    runs-on: ${{ matrix.os }}
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: 3.41.6, cache: true }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - if: runner.os == 'macOS'
        run: flutter build macos --debug
      - if: runner.os == 'Windows'
        run: flutter build windows --debug
