# Linux(x64) 앱을 빌드해 GitHub Release에 붙인다. scripts/release.ps1이 Release를 만들면 자동으로 돈다
# (release-macos.yml과 같은 방식).
name: Release (Linux)
on:
  release: { types: [published] }
  workflow_dispatch:
    inputs:
      tag: { description: '올릴 Release 태그 (예: v0.9.0)', required: true }

permissions: { contents: write }

jobs:
  linux:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with: { ref: "${{ github.event.release.tag_name || inputs.tag }}" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: 3.41.6, cache: true }
      - name: 빌드 도구와 libmpv
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libmpv-dev mpv
      - run: flutter pub get
      - run: flutter build linux --release
      - name: 묶어서 Release에 올리기
        run: |
          name="transcue-${TAG#v}-linux-x64"
          mv build/linux/x64/release/bundle "$name"
          tar -czf "$name.tar.gz" "$name"
          ls -lh "$name.tar.gz"
          gh release upload "$TAG" "$name.tar.gz" --clobber
